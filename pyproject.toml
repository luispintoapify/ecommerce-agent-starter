[project]
name = "ecommerce-agent-starter"
version = "0.1.0"
description = "Give any AI agent live product data through the Apify MCP server."
readme = "README.md"
license = { file = "LICENSE" }
# 3.10 is the floor because the official `mcp` SDK requires it. The REST path in
# rag_refresh.py would run on 3.9; the MCP path is what raises the bar.
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.optional-dependencies]
pinecone = ["openai>=1.40", "pinecone>=5.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# benchmark/tests guards the scoring rules, so CI has to run it too: rules that
# drift toward one arm are exactly the failure a benchmark cannot afford.
testpaths = ["tests", "benchmark/tests"]
pythonpath = ["."]
