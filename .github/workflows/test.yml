name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling, which are the two that actually catch a
        # version break. 3.10 is the floor because the official mcp SDK requires
        # it. 3.14 is where this was developed, and the version a maintainer runs
        # is the worst one to leave untested.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test
        # No Apify token needed. The suite runs against captured Actor output in
        # tests/fixtures/, so it never spends credits and never flakes on a
        # retailer being slow.
        run: pytest -q

      - name: Compile every module
        # The test suite imports neither the benchmark arms nor harness.py, so a
        # syntax error in benchmark/ used to pass CI. compileall reads all of it
        # without needing playwright or an Apify token installed.
        run: python -m compileall -q apify_products.py mcp_client.py rag_refresh.py runtime_call.py benchmark/

      - name: Import check
        # Compiling proves the syntax parses. Importing proves the module body
        # runs and the entry points resolve their arguments.
        run: |
          python -c "import apify_products, mcp_client"
          python runtime_call.py --help > /dev/null
          python rag_refresh.py --help > /dev/null
